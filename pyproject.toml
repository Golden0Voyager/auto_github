[project]
name = "auto-github"
version = "0.1.0"
description = "Daily GitHub Curation & Trend Observer"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    "openai>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
ignore_missing_imports = true
files = ["src/"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.bandit]
skips = ["B101", "B311", "B404", "B603"]
