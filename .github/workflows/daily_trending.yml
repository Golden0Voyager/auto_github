name: 🌌 Daily GitHub Curation & Trend Observer

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'templates/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/daily_trending.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'templates/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/daily_trending.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Timeframe to curate'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - monthly
      persona:
        description: 'Persona to use for reports'
        required: true
        default: 'intermediate'
        type: choice
        options:
          - intermediate
          - beginner
          - advanced

# 同一 ref 串行：并发跑会让两次 curate 争抢 auto-docs 上的去重记忆
concurrency:
  group: curate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked, fails on uv.lock drift)
        run: uv sync --frozen --dev

      - name: Run ruff check
        run: uv run ruff check src/ tests/

      - name: Run mypy
        run: uv run mypy src/

      - name: Run security scan (bandit)
        run: uv tool run bandit -q -r src/

      - name: Run tests with coverage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run pytest tests/ --cov --cov-report=term-missing

      - name: Enforce coverage threshold
        run: uv run coverage report

  # 依赖漏洞扫描单独成 job：红叉可见，但不阻塞 curate-and-notify 发日报
  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Verify uv.lock matches pyproject.toml
        run: uv lock --check

      - name: Audit locked dependencies
        run: |
          uv export --frozen --no-dev --no-hashes -o /tmp/deps.txt
          uv tool run pip-audit -r /tmp/deps.txt

  curate-and-notify:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write # Allows writing and pushing daily reports back to repository logs

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (same lockfile the tests ran on)
        run: uv sync --frozen

      - name: Restore curation memory from auto-docs
        run: |
          # reports/*.json 是系统的记忆。CI 只往 auto-docs 写,main 上那份是陈旧初值,
          # 不读回来等于每次都用空白历史做去重判断。
          # 合并而非覆盖:history 取日期并集、cycles 取 max(直接覆盖会把 main 上的
          # 归档轮次抹掉,阶梯冷却又退回第 1 轮),archive 以 auto-docs 为准(它才反映最新冷却状态)。
          if ! git ls-remote --exit-code origin auto-docs >/dev/null 2>&1; then
            echo "auto-docs 还不存在,使用 main 的记忆作为初值"
            exit 0
          fi
          git fetch --quiet origin auto-docs
          python3 - <<'PYEOF'
          import json, subprocess
          from pathlib import Path

          def read(name):
              """返回 None 表示 auto-docs 上缺失/不可读(该回退到 main)，{} 表示它确实是空的。"""
              out = subprocess.run(
                  ["git", "show", f"origin/auto-docs:reports/{name}"],
                  capture_output=True, text=True,
              )
              if out.returncode != 0:
                  return None
              if not out.stdout.strip():
                  return {}
              try:
                  return json.loads(out.stdout)
              except json.JSONDecodeError:
                  print(f"auto-docs:reports/{name} 解析失败,回退到 main 的副本")
                  return None

          reports = Path("reports")

          def load_local(name):
              raw = (reports / name).read_text(encoding="utf-8")
              return json.loads(raw) if raw.strip() else {}

          def write(name, data):
              (reports / name).write_text(
                  json.dumps(data, ensure_ascii=False, indent=2), encoding="utf-8"
              )

          history_main = load_local("repo_history.json")
          cycles_main = load_local("repo_cycles.json")
          archive_main = load_local("high_star_archive.json")

          history_docs = read("repo_history.json")
          cycles_docs = read("repo_cycles.json")
          archive_docs = read("high_star_archive.json")

          if history_docs is not None:
              merged = {
                  k: sorted(set(history_main.get(k, [])) | set(history_docs.get(k, [])))
                  for k in set(history_main) | set(history_docs)
              }
              write("repo_history.json", merged)
              print(f"merged repo_history.json: main={len(history_main)} auto-docs={len(history_docs)} -> {len(merged)}")

          if cycles_docs is not None:
              # 取 max：直接覆盖会把 main 上的归档轮次抹掉,阶梯冷却又退回第 1 轮
              merged_cycles = {
                  k: max(cycles_main.get(k, 0), cycles_docs.get(k, 0))
                  for k in set(cycles_main) | set(cycles_docs)
              }
              write("repo_cycles.json", merged_cycles)
              print(f"merged repo_cycles.json: main={len(cycles_main)} auto-docs={len(cycles_docs)} -> {len(merged_cycles)}")

          if archive_docs is not None:
              # archive 存的是"仍在冷却中"的标记,auto-docs 是唯一权威,包括它为空的情况
              write("high_star_archive.json", archive_docs)
              print(f"restored high_star_archive.json from auto-docs: {len(archive_docs)} 项 (main 原 {len(archive_main)} 项)")
          PYEOF

      - name: Run Curator Pipeline
        env:
          # LLM Engine API Keys
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}

          # GitHub API Token (automatically provided by GitHub to bypass API limits)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # Webhook Notification URIs
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

          # Actions 日志按块缓冲会让 per-stage 成本归因挤在一起
          PYTHONUNBUFFERED: 1
        run: |
          TIMEFRAME="${{ github.event.inputs.since || 'daily' }}"
          PERSONA="${{ github.event.inputs.persona || 'intermediate' }}"

          echo "Running pipeline with timeframe=$TIMEFRAME and persona=$PERSONA..."
          uv run python src/main.py --since "$TIMEFRAME" --persona "$PERSONA"

      - name: Upload report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ github.run_id }}
          path: reports/
          if-no-files-found: ignore

      - name: Push reports to auto-docs (orphan branch, no main contamination)
        run: |
          set -euo pipefail
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          if [ ! -d "reports" ] || [ -z "$(git status --porcelain reports/)" ]; then
            echo "No new reports generated or no changes detected."
            exit 0
          fi

          # 用 `src/.` 显式表达"拷内容"：`cp -r reports/ dest/` 的尾斜杠语义在 BSD/GNU cp
          # 下不一致(macOS 拷内容、Ubuntu 拷目录本身),脚本只在 Linux runner 上跑但本地无法验证
          rm -rf /tmp/auto-docs-save
          mkdir -p /tmp/auto-docs-save
          cp -a reports/. /tmp/auto-docs-save/

          git fetch --quiet origin auto-docs 2>/dev/null || true
          if git rev-parse --verify --quiet origin/auto-docs >/dev/null; then
            # -f 必需：reports/*.json 刚被合并+管线改过,不带 -f 会 "local changes would be
            # overwritten by checkout" 直接失败(新生成的内容已存在 /tmp/auto-docs-save,不会丢)
            git checkout -q -f -B _docs origin/auto-docs
            rm -rf reports/
          else
            git checkout -q --orphan _docs
            # orphan 检出会带着 main 的全部索引，只保留 reports/
            git rm -r --cached -q .
            rm -rf reports/
          fi
          mkdir -p reports
          cp -a /tmp/auto-docs-save/. reports/
          rm -rf /tmp/auto-docs-save

          git add reports/
          if git diff --cached --quiet; then
            echo "No changes to commit; skipping."
            exit 0
          fi

          git commit -q -m "docs: auto-commit curation report and dedup memory [skip ci]"

          pushed=""
          for attempt in 1 2 3; do
            if git push origin _docs:auto-docs; then
              pushed="yes"
              break
            fi
            echo "push rejected (attempt $attempt) — rebasing onto latest auto-docs"
            git fetch --quiet origin auto-docs
            # 本次新生成的报告与状态必须胜出，否则并发跑会丢记忆
            git rebase -X theirs origin/auto-docs || { git rebase --abort; exit 1; }
          done

          if [ -z "$pushed" ]; then
            echo "::error::failed to push reports to auto-docs after 3 attempts"
            exit 1
          fi
          echo "Successfully pushed reports and dedup memory to auto-docs (orphan) branch."
