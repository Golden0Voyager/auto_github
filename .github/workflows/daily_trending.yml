name: 🌌 Daily GitHub Curation & Trend Observer

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'refactor/**', 'chore/**', 'docs/**']
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/daily_trending.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'config/**'
      - 'requirements.txt'
      - '.github/workflows/daily_trending.yml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Timeframe to curate'
        required: true
        default: 'daily'
        type: choice
        options:
          - daily
          - weekly
          - monthly
      persona:
        description: 'Persona to use for reports'
        required: true
        default: 'intermediate'
        type: choice
        options:
          - intermediate
          - beginner
          - advanced

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Tests with Coverage Check
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        python -m pytest tests/ \
          --cov=src \
          --cov-report=term-missing \
          --cov-fail-under=85 \
          -v

  curate-and-notify:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows writing and pushing daily reports back to repository logs

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Curator Pipeline
      env:
        # LLM Engine API Keys
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
        
        # GitHub API Token (automatically provided by GitHub to bypass API limits)
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
        # Webhook Notification URIs
        FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        # Use inputs from manual trigger if available, otherwise default to daily and intermediate
        TIMEFRAME="${{ github.event.inputs.since || 'daily' }}"
        PERSONA="${{ github.event.inputs.persona || 'intermediate' }}"
        
        echo "Running pipeline with timeframe=$TIMEFRAME and persona=$PERSONA..."
        python src/main.py --since "$TIMEFRAME" --persona "$PERSONA"

    - name: Push reports to auto-docs (orphan branch, no main contamination)
      run: |
        set -euo pipefail
        git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # Check if there are changes in reports/ directory to commit
        if [ ! -d "reports" ] || [ -z "$(git status --porcelain reports/)" ]; then
          echo "No new reports generated or no changes detected."
          exit 0
        fi
        
        # Save report artifacts
        mkdir -p /tmp/auto-docs-save
        cp -r reports/ /tmp/auto-docs-save/
        
        # Switch to auto-docs orphan branch (preserves only reports/ on push)
        git fetch origin auto-docs 2>/dev/null || true
        git checkout -f -B _docs origin/auto-docs 2>/dev/null || git checkout --orphan _docs

        # Replace report files
        rm -rf reports/
        mkdir -p reports
        cp -r /tmp/auto-docs-save/reports/* reports/
        rm -rf /tmp/auto-docs-save

        git add reports/
        if git diff --cached --quiet; then
          echo "No changes to commit; skipping."
          exit 0
        fi

        git commit -m "docs: auto-commit daily github curation report logs [skip ci]"
        git push --force origin _docs:auto-docs
        echo "Successfully pushed daily reports to auto-docs (orphan) branch."
