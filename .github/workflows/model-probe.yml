name: 🔬 Model Probe (manual only)

# 诊断用，不参与日报：只跑一次真实调用对照表，不产报告、不写 auto-docs、不推 webhook。
on:
  workflow_dispatch:
    inputs:
      only:
        description: '只测模型名包含该子串的（留空 = 测全部候选）'
        required: false
        default: ''
      probes:
        description: '只跑这些探针（逗号分隔，如 T3,T4；留空 = 全跑）'
        required: false
        default: ''

concurrency:
  group: model-probe
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --frozen

      - name: Probe candidate models
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          # 走 env 而不是把 ${{ }} 内插进命令行，避开 Actions 脚本注入面
          PROBE_ONLY: ${{ github.event.inputs.only }}
          PROBE_PROBES: ${{ github.event.inputs.probes }}
          PYTHONUNBUFFERED: 1
        run: |
          ARGS=()
          if [ -n "$PROBE_ONLY" ]; then ARGS+=(--only "$PROBE_ONLY"); fi
          if [ -n "$PROBE_PROBES" ]; then ARGS+=(--probes "$PROBE_PROBES"); fi
          uv run python scripts/probe_models.py "${ARGS[@]}"
