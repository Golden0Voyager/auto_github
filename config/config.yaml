# auto_github Configuration File

# GitHub API & Crawling Settings
github:
  # The core LLM giants' GitHub organizations/users to monitor
  monitored_orgs:
    - deepseek-ai
    - openai
    - anthropic
    - google-deepmind
    - google-research
    - meta-llama
    - mistralai
    - microsoft
    - huggingface
    - zhipuai
    - THUDM
    - moonshotai
    - MiniMax-AI
    - xai-org
    - NousResearch
    - Tencent-Hunyuan
    - XiaomiMiMo
    - QwenLM
    - vllm-project
    - modelcontextprotocol
    - dspy-ai
    - unslothai
    - sgl-project
  # Key individuals in the space to track
  monitored_users:
    - karpathy
    - lucidrains
    - ggerganov
    - comfyanonymous
    - jxnl
    - danielmiessler
    - tiangolo
    - tonyzzhao
    - danijar
    - jonbarron
    - keijiro
    - patriciogonzalezvivo
    - mattdesl
  # Max trending items to parse (default top 15)
  max_trending_repos: 15
  # Max giant repos to fetch (default top 5 per org)
  max_org_repos: 5

# AI Settings & Default Model Options
# Token Plan 免费公测，详见 docs/api/sensenova-token-plan-usage.md
ai:
  default_provider: sensenova  # Options: sensenova, openai, gemini
  model_v3: sensenova-6.7-flash-lite   # For Crawl/Analyze/Summarize/Translate/Layout
  model_r1: sensenova-6.7-flash-lite   # For Reflect (R1 已下线，统一使用 flash-lite)
  temperature: 0.3
  max_tokens: 4096
  # Rate limit backup delay (seconds between API calls to prevent 429 RPM/QPS limits)
  rate_limit_delay: 2.0

# 高星项目去重配置（节省算力 + 给新兴项目留展位）
dedup:
  # 视为"高星"项目的最低 star 阈值（低于此值不进入去重逻辑，让新项目自由展示）
  high_star_threshold: 10000
  # 累计出现次数达到此值后进入「高🌟项目存档」，30 天内不再推送
  archive_threshold: 3
  # 存档冷却天数：进入存档后多少天内不再出现在日报中
  archive_cooldown_days: 30
  # 历史记录持久化文件（相对项目根目录）
  history_file: "reports/repo_history.json"
  archive_file: "reports/high_star_archive.json"

# Stage 2 LLM 批处理前的廉价预筛（避免 188+ repo 一次性塞给 LLM 时 completion 触顶 max_tokens=4096）
stage2_pre_filter:
  enabled: true
  max_repos: 88  # 按 stars 降序保留头部 N 个，砍掉长尾

# Notification Settings
notifications:
  # Webhook configurations (will read from env variables if available)
  feishu_webhook_url: ""
  slack_webhook_url: ""
  discord_webhook_url: ""
  # Local report storage directory
  local_report_dir: "./reports"
  # Save raw crawled data for transparency/debugging
  save_raw_data: true

# 三桶分配引擎配置：Early Bird / High-Star Hot / Deep Dive 按配额分配
bucket_allocation:
  enabled: true
  total_slots: 9
  early_bird: 3
  high_star_hot: 3
  deep_dive: 3
