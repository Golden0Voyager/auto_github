# AI Settings & Default Model Options
# roles 是模型路由的唯一真相；代码级默认在 src/config.py 的 AIConfig.roles，
# 两处必须同步（tests/test_config.py::test_code_role_defaults_mirror_config_yaml 会守住这条）。
ai:
  default_provider: openrouter
  temperature: 0.3
  max_tokens: 8192
  rate_limit_delay: 4.0
  roles:
    classifier:
      # T1 判别层：一次 batch 决定全报告的 S/A/B/C 评级、tags 与 selection_reason，
      # 这些又原样进 writer 的 prompt —— 错一次要为下游 37 次调用买单，所以配最好的
      # 模型；super-vl 是免费 Nvidia 池里唯一支持 structured_outputs 的，正好治
      # "batch JSON 解析失败率过高"。降级腿刻意留在 sensenova（跨 provider），
      # 模型 ID 按官方 Token Plan 文档为 deepseek-flash。
      model: nvidia/nemotron-3.5-super-vl:free
      provider: openrouter
      fallback_model: deepseek-flash
      fallback_provider: sensenova
    writer:
      # A 案（现役）。B 案见下方 writer_variants.b
      # 2026-10-16: ultra 反复 returned no choices（10/15 两班实测 6 次、4+2 次重试失败），
      # 主写手换成 super-vl（120B/12B 激活、max_completion 131k、免费 Nvidia 里唯一支持
      # structured_outputs）；ultra 转为第二条腿。RoleConfig 只有一级 fallback,
      # 所以链路是 super-vl → ultra → 英文 stub。
      model: nvidia/nemotron-3.5-super-vl:free
      provider: openrouter
      fallback_model: nvidia/nemotron-3-ultra-550b-a55b:free
      fallback_provider: openrouter
    translator_a:
      model: tencent/Hunyuan-MT-7B
      provider: siliconflow
      # 主腿没有第二条命时，一家欠费就把 A/B 与 Review 一起带走（10/12-10/15 实测）。
      # 降级腿指向 sensenova 的轻量模型：只要 SENSENOVA_API_KEY 在，中文层就不会整条消失。
      fallback_model: sensenova-6.8-flash-lite
      fallback_provider: sensenova
    translator_b:
      # 故意与 translator_a 跨 provider：两通道同账户时，一次欠费/限流就把中文层
      # 和 Review 一起带走（10/12-10/15 的事故）。Gemma 与 Nvidia 也不同家族，
      # 比稿才有区分度。openrouter 的 key、workflow env 与 _PROVIDER_ENV 都已就绪。
      model: google/gemma-4-31b-it:free
      provider: openrouter
      fallback_model: sensenova-6.8-flash-lite
      fallback_provider: sensenova
    reviewer:
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      provider: openrouter
      fallback_model: nvidia/nemotron-3-super-120b-a12b:free
      fallback_provider: openrouter

  # writer 的 A/B：'a' 即上面 roles.writer 本身；改成 'b' 就换用候选模型跑一轮对比质量。
  # 也可以不改这里,用环境变量 WRITER_VARIANT=b 临时覆盖（空值或 'config' = 不覆盖,
  # schedule 触发的定时跑就是空值,所以这行说了算）。
  # b 用新一代 lightning 做候选时,降级方向反过来指向 A 案,两案互为兜底。
  # 2026-10-15 A/B 实测（同为 9 仓库、同一份 prompt）：
  #   b 的 Write output tokens 58,038 vs a 的 14,004（4.1x），
  #   且 4/9 产物过不了 WRITER_SECTIONS 完整性门（a 为 0/9）——花得多、能用的少,回 A 案。
  writer_variant: a
  writer_variants:
    b:
      model: nvidia/nemotron-3.5-lightning:free
      provider: openrouter
      fallback_model: nvidia/nemotron-3.5-super-vl:free
      fallback_provider: openrouter

# 高星项目去重配置（节省算力 + 给新兴项目留展位）
dedup:
  # 视为"高星"项目的最低 star 阈值（低于此值不进入去重逻辑，让新项目自由展示）
  high_star_threshold: 10000
  # 累计出现次数达到此值后进入「高🌟项目存档」，冷却期内不再推送
  archive_threshold: 3
  # 存档冷却基础天数（steps_cooldown=true 时按归档轮次递增）
  archive_cooldown_days: 30
  # 历史记录持久化文件（相对项目根目录）
  history_file: "reports/repo_history.json"
  archive_file: "reports/high_star_archive.json"
  # "首次出现"窗口天数：过去 N 天内未见视为新项目（而非"永远没见过"）
  first_seen_window_days: 90
  # 历史记录裁剪 TTL（天）：保存最近 N 天的出现记录，超时清理防膨胀
  history_ttl_days: 365
  # 冷却期上限天数（步进冷却时封顶值）
  max_cooldown_days: 90
  # 开启步进冷却：归档次数越多，冷却期越长（1× → 1.5× → 2× → ...）
  steps_cooldown: true
  # 归档次数计数器持久化文件（相对项目根目录）
  cycles_file: "reports/repo_cycles.json"

# 分桶引擎关闭时的回退预筛：按 stars 降序保留头部 N 个,砍掉长尾,
# 避免一次把 188+ repo 塞给 Stage 2 批量分类导致 completion 触顶。
# bucket_allocation.enabled=true 时不生效(由三桶配额直接把候选压到 total_slots)。
stage2_pre_filter:
  enabled: true
  max_repos: 88

# Notification Settings
notifications:
  # Webhook configurations (will read from env variables if available)
  feishu_webhook_url: ""
  slack_webhook_url: ""
  discord_webhook_url: ""
  # Local report storage directory
  local_report_dir: "./reports"
  # Save raw crawled data for transparency/debugging
  save_raw_data: true

# 三桶分配引擎配置：Early Bird / High-Star Hot / Deep Dive 按配额分配
bucket_allocation:
  enabled: true
  total_slots: 9
  early_bird: 3
  high_star_hot: 3
  deep_dive: 3
  # 主题多样性约束：开启后单类 tds（T/E/S）不得超过 total_slots 的此比例
  diversity_enabled: true
  diversity_max_ratio: 0.4
