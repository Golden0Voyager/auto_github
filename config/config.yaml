# AI Settings & Default Model Options
# roles 是模型路由的唯一真相；代码级默认在 src/config.py 的 AIConfig.roles，
# 两处必须同步（tests/test_config.py::test_code_role_defaults_mirror_config_yaml 会守住这条）。
ai:
  default_provider: openrouter
  temperature: 0.3
  max_tokens: 8192
  rate_limit_delay: 4.0
  roles:
    classifier:
      # 判别层：一次 batch 决定全报告的 S/A/B/C 评级、tags 与 selection_reason，
      # 这些又原样进 writer 的 prompt —— 错一次要为下游 37 次调用买单，所以首腿配最稳的。
      # 刻意不放 sensenova：classifier 的单发是全管线最大的一枪（实测 ≈3500 token），
      # 而 sensenova 的限免额度按低频小请求设计（连打 3 轮 first-attempt 成功率 0/3）。
      chain:
        - { model: agnes-3.0-flash, provider: agnes }
        - { model: nvidia/nemotron-3.5-super-vl:free, provider: openrouter }
        - { model: glm-5.2, provider: sensenova }
        - { model: sensenova-6.8-flash-lite, provider: sensenova }
    writer:
      # A 案（现役），B 案见下方 writer_variants.b。链是有序的：逐腿尝试，
      # 第一条给出非空正文的腿胜出，全部腿都失败才落英文 stub。
      chain:
        - { model: agnes-3.0-flash, provider: agnes }
        - { model: nvidia/nemotron-3-ultra-550b-a55b:free, provider: openrouter }
        - { model: inclusionai/ling-3.1-flash, provider: zenmux }
        - { model: sensenova-6.8-flash-lite, provider: sensenova }
    translator_a:
      # A 通道。两条通道的 L1 必须既不同模型也不同 provider，否则 A/B 变同源、
      # 比稿失去意义。
      chain:
        - { model: tencent/Hunyuan-MT-7B, provider: siliconflow }
        - { model: nvidia/nemotron-3.5-super-vl:free, provider: openrouter }
        - { model: inclusionai/ling-3.1-flash, provider: zenmux }
        - { model: sensenova-6.8-flash-lite, provider: sensenova }
    translator_b:
      # B 通道，故意与 translator_a 跨 provider 跨家族，比稿才有区分度。
      chain:
        - { model: agnes-2.5-flash, provider: agnes }
        - { model: nvidia/nemotron-3-ultra-550b-a55b:free, provider: openrouter }
        - { model: inclusionai/ling-3.1-flash, provider: zenmux }
        - { model: sensenova-6.8-flash-lite, provider: sensenova }
    reviewer:
      # Jev（TypeSafe）是链前的前置判断通道（见下方 ai.jev），这三条是它拿不准时的字母裁判。
      # 任一翻译通道的 L1 都被排除：裁判不能评自己的译文 —— 实测 Hunyuan-MT-7B 在
      # "A 漏 / B 好"的对照里仍选 A（A 偏见），而它本身就是 translator_a 的首腿。
      chain:
        - { model: agnes-3.0-flash, provider: agnes }
        - { model: glm-5.2, provider: sensenova }
        - { model: inclusionai/ling-3.1-flash, provider: zenmux }

  # 比稿判断通道（TypeSafe System One）。这是本项目第一个付费依赖：
  # $42 / 1B input token、output 免费，一轮 Review 约 2.5 万 input ≈ $0.001。
  # 凭证走环境变量 TYPESAFE_API_KEY；没配就直接退回 ultra 字母裁判，不影响管线。
  # 一次请求里并行问 Choice(better_draft) + Noul(draft_incomplete)，
  # 后者专门抓"译文丢了小节/整段漏译"这种只看文笔抓不到的失效。
  jev:
    model: jev-latest
    confidence_threshold: 0.6
    incomplete_threshold: 0.5
    timeout: 30.0

  # writer 的 A/B：'a' 即上面 roles.writer 本身；改成 'b' 就换用候选模型跑一轮对比质量。
  # 也可以不改这里,用环境变量 WRITER_VARIANT=b 临时覆盖（空值或 'config' = 不覆盖,
  # schedule 触发的定时跑就是空值,所以这行说了算）。
  # b 案只换首腿，它的 L2 就是 A 案的首腿，两案互为兜底。
  writer_variant: a
  writer_variants:
    b:
      chain:
        - { model: agnes-2.5-flash, provider: agnes }
        - { model: agnes-3.0-flash, provider: agnes }
        - { model: nvidia/nemotron-3-ultra-550b-a55b:free, provider: openrouter }
        - { model: inclusionai/ling-3.1-flash, provider: zenmux }
        - { model: sensenova-6.8-flash-lite, provider: sensenova }

# 高星项目去重配置（节省算力 + 给新兴项目留展位）
dedup:
  # 视为"高星"项目的最低 star 阈值（低于此值不进入去重逻辑，让新项目自由展示）
  high_star_threshold: 10000
  # 累计出现次数达到此值后进入「高🌟项目存档」，冷却期内不再推送
  archive_threshold: 3
  # 存档冷却基础天数（steps_cooldown=true 时按归档轮次递增）
  archive_cooldown_days: 30
  # 历史记录持久化文件（相对项目根目录）
  history_file: "reports/repo_history.json"
  archive_file: "reports/high_star_archive.json"
  # "首次出现"窗口天数：过去 N 天内未见视为新项目（而非"永远没见过"）
  first_seen_window_days: 90
  # 历史记录裁剪 TTL（天）：保存最近 N 天的出现记录，超时清理防膨胀
  history_ttl_days: 365
  # 冷却期上限天数（步进冷却时封顶值）
  max_cooldown_days: 90
  # 开启步进冷却：归档次数越多，冷却期越长（1× → 1.5× → 2× → ...）
  steps_cooldown: true
  # 归档次数计数器持久化文件（相对项目根目录）
  cycles_file: "reports/repo_cycles.json"

# 分桶引擎关闭时的回退预筛：按 stars 降序保留头部 N 个,砍掉长尾,
# 避免一次把 188+ repo 塞给 Stage 2 批量分类导致 completion 触顶。
# bucket_allocation.enabled=true 时不生效(由三桶配额直接把候选压到 total_slots)。
stage2_pre_filter:
  enabled: true
  max_repos: 88

# Notification Settings
notifications:
  # Webhook configurations (will read from env variables if available)
  feishu_webhook_url: ""
  slack_webhook_url: ""
  discord_webhook_url: ""
  # Local report storage directory
  local_report_dir: "./reports"
  # Save raw crawled data for transparency/debugging
  save_raw_data: true

# 三桶分配引擎配置：Early Bird / High-Star Hot / Deep Dive 按配额分配
bucket_allocation:
  enabled: true
  total_slots: 9
  early_bird: 3
  high_star_hot: 3
  deep_dive: 3
  # 主题多样性约束：开启后单类 tds（T/E/S）不得超过 total_slots 的此比例
  diversity_enabled: true
  diversity_max_ratio: 0.4
