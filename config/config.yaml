    - openai
    - anthropic
    - google-deepmind
    - google-research
    - meta-llama
    - mistralai
    - microsoft
    - huggingface
    - zhipuai
    - THUDM
    - moonshotai
    - MiniMax-AI
    - xai-org
    - NousResearch
    - Tencent-Hunyuan
    - XiaomiMiMo
    - QwenLM
    - vllm-project
    - modelcontextprotocol
    - dspy-ai
    - unslothai
    - sgl-project
  # Key individuals in the space to track
  monitored_users:
    - karpathy
    - lucidrains
    - ggerganov
    - comfyanonymous
    - jxnl
    - danielmiessler
    - tiangolo
    - tonyzzhao
