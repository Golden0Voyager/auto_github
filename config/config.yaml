# auto_github Configuration File

# GitHub API & Crawling Settings
github:
  # The core LLM giants' GitHub organizations/users to monitor
  monitored_orgs:
    - deepseek-ai
    - openai
    - anthropic
    - google-deepmind
    - google-research
    - meta-llama
    - mistralai
    - microsoft
    - huggingface
    - zhipuai
    - THUDM
    - moonshotai
    - MiniMax-AI
    - xai-org
    - NousResearch
    - Tencent-Hunyuan
    - XiaomiMiMo
    - QwenLM
    - vllm-project
    - modelcontextprotocol
    - dspy-ai
    - unslothai
    - sgl-project
  # Key individuals in the space to track
  monitored_users:
    - karpathy
    - lucidrains
    - ggerganov
    - comfyanonymous
    - jxnl
    - danielmiessler
    - tiangolo
    - tonyzzhao
    - danijar
    - jonbarron
    - keijiro
    - patriciogonzalezvivo
    - mattdesl
  # Max trending items to parse (default top 15)
  max_trending_repos: 15
  # Max giant repos to fetch (default top 5 per org)
  max_org_repos: 5

# AI Settings & Default Model Options
# roles 是模型路由的唯一真相；代码级默认在 src/config.py 的 AIConfig.roles，
# 两处必须同步（tests/test_config.py::test_code_role_defaults_mirror_config_yaml 会守住这条）。
ai:
  default_provider: openrouter
  temperature: 0.3
  max_tokens: 8192
  rate_limit_delay: 4.0
  roles:
    classifier:
      model: sensenova-6.8-flash-lite
      provider: sensenova
    writer:
      # A 案（现役）。B 案见下方 writer_variants.b
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      provider: openrouter
      # writer 原本没有 fallback：ultra 连续返回空 choices 时只剩重试,没有第二条腿
      fallback_model: nvidia/nemotron-3-super-120b-a12b:free
      fallback_provider: openrouter
    translator_a:
      model: tencent/Hunyuan-MT-7B
      provider: siliconflow
    translator_b:
      model: Qwen/Qwen2.5-7B-Instruct
      provider: siliconflow
    reviewer:
      model: nvidia/nemotron-3-ultra-550b-a55b:free
      provider: openrouter
      fallback_model: nvidia/nemotron-3-super-120b-a12b:free
      fallback_provider: openrouter

  # writer 的 A/B：'a' 即上面 roles.writer 本身；改成 'b' 就换用候选模型跑一轮对比质量。
  # 也可以不改这里,用环境变量 WRITER_VARIANT=b（workflow_dispatch 的下拉框走这条）。
  # b 用新一代 lightning 做主模型时,降级方向反过来指向 ultra,两案互为兜底。
  writer_variant: a
  writer_variants:
    b:
      model: nvidia/nemotron-3.5-lightning:free
      provider: openrouter
      fallback_model: nvidia/nemotron-3-ultra-550b-a55b:free
      fallback_provider: openrouter

# 高星项目去重配置（节省算力 + 给新兴项目留展位）
dedup:
  # 视为"高星"项目的最低 star 阈值（低于此值不进入去重逻辑，让新项目自由展示）
  high_star_threshold: 10000
  # 累计出现次数达到此值后进入「高🌟项目存档」，冷却期内不再推送
  archive_threshold: 3
  # 存档冷却基础天数（steps_cooldown=true 时按归档轮次递增）
  archive_cooldown_days: 30
  # 历史记录持久化文件（相对项目根目录）
  history_file: "reports/repo_history.json"
  archive_file: "reports/high_star_archive.json"
  # "首次出现"窗口天数：过去 N 天内未见视为新项目（而非"永远没见过"）
  first_seen_window_days: 90
  # 历史记录裁剪 TTL（天）：保存最近 N 天的出现记录，超时清理防膨胀
  history_ttl_days: 365
  # 冷却期上限天数（步进冷却时封顶值）
  max_cooldown_days: 90
  # 开启步进冷却：归档次数越多，冷却期越长（1× → 1.5× → 2× → ...）
  steps_cooldown: true
  # 归档次数计数器持久化文件（相对项目根目录）
  cycles_file: "reports/repo_cycles.json"

# 分桶引擎关闭时的回退预筛：按 stars 降序保留头部 N 个,砍掉长尾,
# 避免一次把 188+ repo 塞给 Stage 2 批量分类导致 completion 触顶。
# bucket_allocation.enabled=true 时不生效(由三桶配额直接把候选压到 total_slots)。
stage2_pre_filter:
  enabled: true
  max_repos: 88

# Notification Settings
notifications:
  # Webhook configurations (will read from env variables if available)
  feishu_webhook_url: ""
  slack_webhook_url: ""
  discord_webhook_url: ""
  # Local report storage directory
  local_report_dir: "./reports"
  # Save raw crawled data for transparency/debugging
  save_raw_data: true

# 三桶分配引擎配置：Early Bird / High-Star Hot / Deep Dive 按配额分配
bucket_allocation:
  enabled: true
  total_slots: 9
  early_bird: 3
  high_star_hot: 3
  deep_dive: 3
  # 主题多样性约束：开启后单类 tds（T/E/S）不得超过 total_slots 的此比例
  diversity_enabled: true
  diversity_max_ratio: 0.4
